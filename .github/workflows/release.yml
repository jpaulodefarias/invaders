name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            archive: invaders-linux-x86_64.zip
            kind: unix

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            archive: invaders-windows-x86_64.zip
            kind: windows

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            archive: invaders-macos-aarch64.zip
            kind: unix

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Linux or macOS
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          package_dir="package/invaders-${{ matrix.name }}"
          mkdir -p "$package_dir" dist

          cp "target/${{ matrix.target }}/release/invaders" "$package_dir/"
          cp -R sounds README.md LICENSE "$package_dir/"

          (
            cd package
            zip -r "../dist/${{ matrix.archive }}" "invaders-${{ matrix.name }}"
          )

      - name: Package Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $packageDir = "package/invaders-${{ matrix.name }}"

          New-Item -ItemType Directory -Force $packageDir, dist | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/invaders.exe" $packageDir
          Copy-Item -Recurse sounds $packageDir
          Copy-Item README.md, LICENSE $packageDir

          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
